<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght=500;800;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body { 
      margin: 0; 
      width: 1080px; 
      height: 1920px; 
      overflow: hidden; 
      background: #000; 
    }
    
    #stage { 
      width: 1080px; 
      height: 1920px; 
      position: relative; 
      background: #000; 
      overflow: hidden; 
    }
    
    .scene-container { 
      position: absolute; 
      inset: 0; 
      opacity: 0; 
      overflow: hidden; 
    }
    
    .scene-media { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transform: scale(1.3); 
    }
    
    .overlay-vignette { 
      position: absolute; 
      inset: 0; 
      background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 130%); 
    }
    
    .flash-overlay {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    .hud-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .badge-wrap { position: absolute; top: 18%; left: 8%; overflow: hidden; border-radius: 4px; }
    .badge { 
      background: #c9a96e; 
      color: #000; 
      padding: 20px 35px; 
      font-family: 'DM Sans', sans-serif; 
      font-size: 38px; 
      font-weight: 900; 
      text-transform: uppercase; 
      letter-spacing: 4px; 
      transform: skewX(-10deg) translateY(100%); 
    }

    #intro-sequence { position: absolute; inset: 0; background: #030303; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #intro-logo { max-width: 400px; max-height: 400px; filter: blur(25px); opacity: 0; }
    #intro-text { font-family: 'DM Sans', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: 6px; color: #c9a96e; font-size: 55px; margin-top: 40px; opacity: 0; }

    .cinema-bar { position: absolute; left: 0; width: 100%; height: 120px; background: #000; z-index: 90; }
    .bar-top { top: -120px; }
    .bar-bottom { bottom: -120px; }
  </style>
</head>
<body>
  
  <div id="stage" data-composition-id="premium-video" data-start="0" data-width="1080" data-height="1920">
    <div class="cinema-bar bar-top" id="bar-top"></div>
    <div class="cinema-bar bar-bottom" id="bar-bottom"></div>
    <div class="flash-overlay" id="flash"></div>

    <div class="hud-overlay">
      <svg viewBox="0 0 1080 1920" fill="none" stroke="#c9a96e" stroke-width="2" style="width: 100%; height: 100%;">
        <path d="M 60,100 L 60,60 L 100,60 M 980,100 L 980,60 L 940,60" />
        <path d="M 60,1820 L 60,1860 L 100,1860 M 980,1820 L 980,1860 L 940,1860" />
        <circle id="hud-circle" cx="540" cy="960" r="130" stroke-dasharray="8 8" opacity="0.4"/>
        <line x1="540" y1="800" x2="540" y2="830" opacity="0.6" />
        <line x1="540" y1="1090" x2="540" y2="1120" opacity="0.6" />
        <line x1="380" y1="960" x2="410" y2="960" opacity="0.6" />
        <line x1="670" y1="960" x2="700" y2="960" opacity="0.6" />
      </svg>
    </div>

    <div id="intro-sequence">
      <img id="intro-logo" src="<!-- INJECT_LOGO -->" onerror="this.style.display='none'">
      <div id="intro-text">DriveMotion</div>
    </div>

    <!-- INJECT_HTML -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    /* INJECT_GSAP */
  </script>

  <script>
    window.__timelines = window.__timelines || {};
    if (typeof tl !== 'undefined') {
      tl.paused(true); 
      window.__timelines["premium-video"] = tl;
    } else {
      window.__timelines["premium-video"] = gsap.exportRoot().pause();
    }
  </script>
</body>
</html>
