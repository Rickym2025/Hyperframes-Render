<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;800;900&family=Playfair+Display:ital@1&display=swap');
    
    body { margin: 0; background: #000; overflow: hidden; }
    
    #stage { width: 1080px; height: 1920px; position: relative; background: #000; overflow: hidden; }
    
    /* Contenitore Scena */
    .scene-container { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
    .scene-media { width: 100%; height: 100%; object-fit: cover; transform: scale(1.3); }
    
    /* Gradienti per dare profondità */
    .overlay-vignette { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 120%); }
    .overlay-bottom { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 40%); }
    
    /* Il Badge Elegante */
    .badge-wrap { position: absolute; top: 18%; left: 8%; overflow: hidden; border-radius: 12px; }
    .badge { background: rgba(201, 169, 110, 0.9); backdrop-filter: blur(10px); color: #000; padding: 25px 45px; font-family: 'DM Sans', sans-serif; font-size: 40px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; transform: translateY(100%); }

    /* Logo Reveal Iniziale */
    #intro-sequence { position: absolute; inset: 0; background: #050505; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #intro-logo { max-width: 400px; max-height: 400px; filter: blur(20px); transform: scale(2); opacity: 0; }
    #intro-text { font-family: 'Playfair Display', serif; color: #c9a96e; font-size: 60px; margin-top: 40px; opacity: 0; font-style: italic; }

    /* Bande Nere Cinematiche */
    .cinema-bar { position: absolute; left: 0; width: 100%; height: 120px; background: #000; z-index: 90; }
    .bar-top { top: -120px; }
    .bar-bottom { bottom: -120px; }
  </style>
</head>
<body>
  
  <div id="stage" data-composition-id="premium-video" data-width="1080" data-height="1920">
    <!-- Bande Cinematiche -->
    <div class="cinema-bar bar-top" id="bar-top"></div>
    <div class="cinema-bar bar-bottom" id="bar-bottom"></div>

    <!-- Logo Reveal -->
    <div id="intro-sequence">
      <img id="intro-logo" src="<!-- INJECT_LOGO -->" onerror="this.style.display='none'">
      <div id="intro-text">Presenta</div>
    </div>

    <!-- INJECT_HTML -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    /* INJECT_GSAP */
  </script>
</body>
</html>
